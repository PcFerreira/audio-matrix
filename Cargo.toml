[workspace]
members = ["crates/matrix-core", "crates/matrix-bridge"]
exclude = ["driver/matrix-input"]
resolver = "3"

[package]
name = "audio-matrix"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Windows audio routing, channel mapping and per-output DSP"
license = "MIT"

[dependencies]
matrix-core = { path = "crates/matrix-core" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wasapi = "=0.25.0"
windows = { version = "=0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Dwm", "Win32_System_Performance", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_Gdi"] }
raw-window-handle = "=0.6.2"

[profile.release]
lto = "thin"
codegen-units = 1

